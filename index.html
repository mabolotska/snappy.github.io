<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomdo</title>
<meta name="description" content="Nomdo for iOS — privacy policy and support.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6b64'/%3E%3Ctext x='16' y='22.5' font-family='Georgia,serif' font-size='18' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf8f5;
    --surface: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #4a4742;
    --ink-mute: #6f6a63;
    --rule: #e2ddd4;
    --accent: #0b6b64;
    --accent-soft: #e6f1ef;
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --surface: #161617;
      --ink: #ece9e4;
      --ink-soft: #c3bfb8;
      --ink-mute: #948f88;
      --rule: #2a2a2c;
      --accent: #6fd3c7;
      --accent-soft: #16292a;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
    text-decoration-color: var(--rule);
    transition: text-decoration-color 120ms ease;
  }

  a:hover { text-decoration-color: currentColor; }

  .card {
    width: 100%;
    max-width: 26rem;
    padding: clamp(1.75rem, 5vw, 2.5rem);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0 0 1.1rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  h1 {
    margin: 0 0 0.6rem;
    font-family: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: clamp(1.9rem, 7vw, 2.35rem);
    line-height: 1.1;
    letter-spacing: -0.018em;
  }

  p {
    margin: 0;
    color: var(--ink-soft);
  }

  ul {
    margin: 1.75rem 0 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid var(--rule);
  }

  li { border-bottom: 1px solid var(--rule); }

  li a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.85rem 0;
    color: var(--ink);
    text-decoration: none;
  }

  li a:hover { color: var(--accent); }

  li a::after {
    content: "→";
    color: var(--ink-mute);
    flex: none;
  }

  li a:hover::after { color: var(--accent); }
</style>
</head>
<body>

<main class="card">
  <p class="eyebrow"><span class="dot" aria-hidden="true"></span>Nomdo · iOS</p>
  <h1>Nomdo</h1>
  <p>Plan breakfast with what you already have.</p>

  <ul>
    <li><a href="support.html">Support</a></li>
    <li><a href="privacy.html">Privacy policy</a></li>
    <li><a href="mailto:artsaverin@gmail.com">Email us</a></li>
  </ul>
</main>

</body>
</html>
